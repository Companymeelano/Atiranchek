name: Build MEELANO Windows installer

on:
  push:
    branches:
      - arena/191d4206-atiranchek
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-win-x64:
    name: Build self-contained Windows x64 app and installer
    runs-on: windows-latest
    steps:
      - name: Check out current branch
        uses: actions/checkout@v7

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\MeelanoExecutiveConsole\MeelanoExecutiveConsole.sln

      - name: Build Release
        run: dotnet build .\MeelanoExecutiveConsole\MeelanoExecutiveConsole.sln --configuration Release --no-restore

      - name: Publish self-contained single-file EXE
        run: >-
          dotnet publish .\MeelanoExecutiveConsole\MeelanoExecutiveConsole.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output .\MeelanoExecutiveConsole\artifacts\win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify application executable
        shell: pwsh
        run: |
          $exe = '.\MeelanoExecutiveConsole\artifacts\win-x64\MeelanoExecutiveConsole.exe'
          if (-not (Test-Path $exe)) { throw "Missing expected executable: $exe" }
          Get-Item $exe | Select-Object FullName, Length

      - name: Upload portable executable
        uses: actions/upload-artifact@v7
        with:
          name: MeelanoExecutiveConsole-win-x64
          path: MeelanoExecutiveConsole/artifacts/win-x64/MeelanoExecutiveConsole.exe
          if-no-files-found: error
          retention-days: 90

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed with exit code $LASTEXITCODE." }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe was not found at $iscc" }
          New-Item -ItemType Directory -Path '.\MeelanoExecutiveConsole\artifacts\installer' -Force | Out-Null

      - name: Build installable setup EXE
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc '.\MeelanoExecutiveConsole\Installer\MeelanoExecutiveConsole.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }

      - name: Verify setup executable
        shell: pwsh
        run: |
          $setup = '.\MeelanoExecutiveConsole\artifacts\installer\MEELANO-Executive-Console-Setup-win-x64.exe'
          if (-not (Test-Path $setup)) { throw "Missing installer: $setup" }
          Get-Item $setup | Select-Object FullName, Length

      - name: Upload installable setup artifact
        uses: actions/upload-artifact@v7
        with:
          name: MEELANO-Executive-Console-Setup-win-x64
          path: MeelanoExecutiveConsole/artifacts/installer/MEELANO-Executive-Console-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 90

      - name: Publish public prerelease download
        if: contains(github.event.head_commit.message, '[publish-installer]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = '.\MeelanoExecutiveConsole\artifacts\installer\MEELANO-Executive-Console-Setup-win-x64.exe'
          $releaseArgs = @(
            'release', 'create', 'v1.0.0-demo', $setup,
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', 'MEELANO Executive Console 1.0.0 - Windows x64 installer',
            '--notes', 'Installable per-user Windows 10/11 x64 package. Self-contained; no separate .NET runtime required. Contains demo-only in-memory data and is not connected to SQL Server. The installer is not code-signed.',
            '--prerelease'
          )
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed with exit code $LASTEXITCODE." }
