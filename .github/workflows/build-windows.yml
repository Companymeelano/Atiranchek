name: Build MEELANO Windows installer

on:
  push:
    branches:
      - arena/191d4206-atiranchek
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a public prerelease after the build and smoke test pass
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build-test-win-x64:
    name: Build and smoke-test Windows x64 installer
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out current branch
        uses: actions/checkout@v7

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore .\MeelanoExecutiveConsole\MeelanoExecutiveConsole.sln

      - name: Run core specifications
        run: dotnet run --project .\MeelanoExecutiveConsole.Specs\MeelanoExecutiveConsole.Specs.csproj --configuration Release --no-restore

      - name: Build Release
        run: dotnet build .\MeelanoExecutiveConsole\MeelanoExecutiveConsole.sln --configuration Release --no-restore

      - name: Publish self-contained single-file EXE
        run: >-
          dotnet publish .\MeelanoExecutiveConsole\MeelanoExecutiveConsole.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output .\MeelanoExecutiveConsole\artifacts\win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Verify application executable
        shell: pwsh
        run: |
          $exe = '.\MeelanoExecutiveConsole\artifacts\win-x64\MeelanoExecutiveConsole.exe'
          if (-not (Test-Path $exe)) { throw "Missing expected executable: $exe" }
          Get-Item $exe | Select-Object FullName, Length

      - name: Upload portable executable
        uses: actions/upload-artifact@v7
        with:
          name: MeelanoExecutiveConsole-win-x64
          path: MeelanoExecutiveConsole/artifacts/win-x64/MeelanoExecutiveConsole.exe
          if-no-files-found: error
          retention-days: 90

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed with exit code $LASTEXITCODE." }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe was not found at $iscc" }
          New-Item -ItemType Directory -Path '.\MeelanoExecutiveConsole\artifacts\installer' -Force | Out-Null

      - name: Build installable setup EXE
        shell: pwsh
        run: |
          $project = [xml](Get-Content '.\MeelanoExecutiveConsole\MeelanoExecutiveConsole.csproj' -Raw)
          $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/Version')
          $appVersion = if ($versionNode) { $versionNode.InnerText.Trim() } else { '' }
          if ($appVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'A valid application version was not found in the project file.' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$appVersion" '.\MeelanoExecutiveConsole\Installer\MeelanoExecutiveConsole.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }

      - name: Verify setup executable
        shell: pwsh
        run: |
          $setup = '.\MeelanoExecutiveConsole\artifacts\installer\MEELANO-Executive-Console-Setup-win-x64.exe'
          if (-not (Test-Path $setup)) { throw "Missing installer: $setup" }
          Get-Item $setup | Select-Object FullName, Length

      - name: Smoke-test installed app startup
        shell: pwsh
        run: |
          function Fail-SmokeTest([string]$message) {
            $singleLine = $message -replace "`r`n|`n|`r", ' | '
            $safeMessage = $singleLine.Replace('%', '%25').Replace(':', '%3A').Replace(',', '%2C')
            Write-Host "::error title=MEELANO startup smoke test::$safeMessage"
            throw $message
          }

          $setup = '.\MeelanoExecutiveConsole\artifacts\installer\MEELANO-Executive-Console-Setup-win-x64.exe'
          $log = Join-Path $env:LOCALAPPDATA 'MEELANO\Logs\startup.log'
          if (Test-Path $log) { Remove-Item $log -Force }

          try {
            $installerProcess = Start-Process -FilePath $setup `
              -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' `
              -Wait -PassThru
          }
          catch {
            Fail-SmokeTest "Starting silent setup failed: $($_.Exception.ToString())"
          }
          if ($installerProcess.ExitCode -ne 0) { Fail-SmokeTest "Silent setup exited with code $($installerProcess.ExitCode)." }

          $installedExe = Join-Path $env:LOCALAPPDATA 'Programs\MEELANO Executive Console\MeelanoExecutiveConsole.exe'
          if (-not (Test-Path $installedExe)) { Fail-SmokeTest "Installed application not found: $installedExe" }
          try {
            $appProcess = Start-Process -FilePath $installedExe -PassThru
          }
          catch {
            Fail-SmokeTest "Starting installed app failed: $($_.Exception.ToString())"
          }

          Start-Sleep -Seconds 10
          $appProcess.Refresh()
          if (Test-Path $log) {
            $details = Get-Content $log -Raw
            if ($details.Length -gt 4000) { $details = $details.Substring(0, 4000) + ' …' }
            Fail-SmokeTest "Application startup exception log: $details"
          }
          if ($appProcess.HasExited) { Fail-SmokeTest "Installed application exited with code $($appProcess.ExitCode)." }
          Stop-Process -Id $appProcess.Id -Force

          # Verify actual physical sidebar placement and the embedded Persian font at two widths.
          $layoutProcess = Start-Process -FilePath $installedExe -ArgumentList '--verify-ui-layout' -PassThru
          if (-not $layoutProcess.WaitForExit(30000)) {
            Stop-Process -Id $layoutProcess.Id -Force
            Fail-SmokeTest 'UI layout verification timed out.'
          }
          if ($layoutProcess.ExitCode -ne 0) {
            $details = if (Test-Path $log) { Get-Content $log -Raw } else { 'No diagnostic log.' }
            Fail-SmokeTest "UI layout verification failed with code $($layoutProcess.ExitCode): $details"
          }

      - name: Upload installable setup artifact
        uses: actions/upload-artifact@v7
        with:
          name: MEELANO-Executive-Console-Setup-win-x64
          path: MeelanoExecutiveConsole/artifacts/installer/MEELANO-Executive-Console-Setup-win-x64.exe
          if-no-files-found: error
          retention-days: 90

  publish-prerelease:
    name: Publish public installer prerelease
    if: contains(github.event.head_commit.message, '[publish-installer]') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: build-test-win-x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out current branch
        uses: actions/checkout@v7

      - name: Download tested installer
        uses: actions/download-artifact@v7
        with:
          name: MEELANO-Executive-Console-Setup-win-x64
          path: .\release-assets\installer

      - name: Download tested portable executable
        uses: actions/download-artifact@v7
        with:
          name: MeelanoExecutiveConsole-win-x64
          path: .\release-assets\portable

      - name: Publish versioned prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $project = [xml](Get-Content '.\MeelanoExecutiveConsole\MeelanoExecutiveConsole.csproj' -Raw)
          $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/Version')
          $appVersion = if ($versionNode) { $versionNode.InnerText.Trim() } else { '' }
          if ($appVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'A valid application version was not found in the project file.' }
          $tag = "v$appVersion-demo"
          $installer = '.\release-assets\installer\MEELANO-Executive-Console-Setup-win-x64.exe'
          $portableExe = '.\release-assets\portable\MeelanoExecutiveConsole.exe'
          foreach ($asset in @($installer, $portableExe)) {
            if (-not (Test-Path $asset)) { throw "Missing tested release asset: $asset" }
          }

          & gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Bump the project Version instead of overwriting a published release." }

          $releaseArgs = @(
            'release', 'create', $tag, $installer, $portableExe,
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', "MEELANO Executive Console $appVersion - Windows x64 downloads",
            '--notes', "Windows 10 version 1809 (build 17763) or newer / Windows 11 x64 downloads. The release includes a per-user installer and a portable self-contained EXE; no separate .NET runtime is required. Both include optional direct SQL Server read-only import: users enter the host, port and credentials at runtime; no credentials or connection string are embedded or saved. Test-only SQL connections encrypt traffic but do not validate server certificates and are vulnerable to server impersonation; use only on an isolated test network with test data and accounts. Automatic reports require two administrator-defined reporting views; unknown or ambiguous data stops the import. Demo data remains the offline fallback. Downloads are not code-signed. Do not use privileged SQL logins; configure a dedicated least-privilege account and validate the target schema before operational use.",
            '--prerelease'
          )
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed with exit code $LASTEXITCODE." }
